<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagler Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading"></div>
    <iframe id="game"></iframe>
    
    <script>
        async function loadEagler() {
            const url = 'https://raw.githubusercontent.com/xXJ0NXx/eagler/refs/heads/main/1.12.2/index.html';
            
            try {
                const response = await fetch(url);
                const html = await response.text();
                
                // Create blob URL
                const blob = new Blob([html], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                
                // Load into iframe
                const iframe = document.getElementById('game');
                iframe.src = blobUrl;
                
                // Hide loading, show iframe
                document.getElementById('loading').style.display = 'none';
                iframe.style.display = 'block';
                
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading: ' + error.message;
            }
        }
        
        loadEagler();
    </script>
</body>
</html>
